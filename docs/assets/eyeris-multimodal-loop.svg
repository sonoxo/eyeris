<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">ZYRA EYERIS multimodal interaction loop</title>
  <desc id="desc">Animated architecture showing gaze, voice and gesture fusing into semantic app context and bounded actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#06070a"/>
      <stop offset="0.5" stop-color="#111328"/>
      <stop offset="1" stop-color="#07080d"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" x2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#8b5cf6"><path d="M0 80H1600M0 160H1600M0 240H1600M0 320H1600M0 400H1600M0 480H1600"/><path d="M160 0V520M320 0V520M480 0V520M640 0V520M800 0V520M960 0V520M1120 0V520M1280 0V520M1440 0V520"/></g>
  <text x="70" y="72" fill="#fff" font-family="Arial, sans-serif" font-size="42" font-weight="700">ZYRA EYERIS // MULTIMODAL INTENT LOOP</text>
  <text x="72" y="108" fill="#9ca3af" font-family="Arial, sans-serif" font-size="20">LOOK → SPEAK / GESTURE → RESOLVE APP STATE → CONFIRM → ACT</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="180" width="250" height="150" rx="22" fill="#151527" stroke="#8b5cf6" stroke-width="3"/>
    <text x="195" y="225" fill="#c4b5fd" font-size="27" font-weight="700">GAZE</text>
    <text x="195" y="260" fill="#fff" font-size="18">Which semantic target?</text>
    <text x="195" y="292" fill="#9ca3af" font-size="16">ephemeral • smoothed • local</text>

    <rect x="350" y="180" width="250" height="150" rx="22" fill="#10232a" stroke="#22d3ee" stroke-width="3"/>
    <text x="475" y="225" fill="#67e8f9" font-size="27" font-weight="700">VOICE</text>
    <text x="475" y="260" fill="#fff" font-size="18">What do you want?</text>
    <text x="475" y="292" fill="#9ca3af" font-size="16">open • update • navigate</text>

    <rect x="630" y="180" width="250" height="150" rx="22" fill="#2c1c10" stroke="#f97316" stroke-width="3"/>
    <text x="755" y="225" fill="#fdba74" font-size="27" font-weight="700">GESTURE</text>
    <text x="755" y="260" fill="#fff" font-size="18">Fast confirm / select</text>
    <text x="755" y="292" fill="#9ca3af" font-size="16">pinch • nod • cancel</text>

    <rect x="930" y="160" width="280" height="190" rx="26" fill="#151724" stroke="url(#pulse)" stroke-width="4" filter="url(#glow)"/>
    <text x="1070" y="213" fill="#fff" font-size="27" font-weight="700">APP CONTEXT</text>
    <text x="1070" y="252" fill="#c4b5fd" font-size="18">routes • visible targets</text>
    <text x="1070" y="282" fill="#67e8f9" font-size="18">registered semantic actions</text>
    <text x="1070" y="312" fill="#fdba74" font-size="18">SHADOW GLASS policy</text>

    <rect x="1260" y="180" width="270" height="150" rx="22" fill="#111827" stroke="#22c55e" stroke-width="3"/>
    <text x="1395" y="225" fill="#86efac" font-size="27" font-weight="700">BOUNDED ACTION</text>
    <text x="1395" y="260" fill="#fff" font-size="18">semantic command</text>
    <text x="1395" y="292" fill="#9ca3af" font-size="16">confirm elevated impact</text>
  </g>

  <g stroke="url(#pulse)" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M320 255H920" stroke-dasharray="12 16"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2s" repeatCount="indefinite"/></path>
    <path d="M600 255H920" stroke-dasharray="12 16"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="1.8s" repeatCount="indefinite"/></path>
    <path d="M880 255H920"/>
    <path d="M1210 255H1250" stroke-dasharray="10 12"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="1.4s" repeatCount="indefinite"/></path>
  </g>

  <circle cx="1070" cy="392" r="8" fill="#22c55e"><animate attributeName="r" values="7;14;7" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="1090" y="399" fill="#9ca3af" font-family="Arial, sans-serif" font-size="18">NO RAW GAZE RETENTION • NO CONTINUOUS CURSOR CHASING</text>
  <text x="70" y="470" fill="#d1d5db" font-family="Arial, sans-serif" font-size="20">EYERIS principle: gaze supplies context; semantic app actions supply control.</text>
</svg>
