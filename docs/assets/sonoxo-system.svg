<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">EYERIS concept map</title><desc id="d">A conceptual four-stage system. No working product is claimed. Motion stops when reduced motion is preferred.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030612"/><stop offset=".5" stop-color="#19052f"/><stop offset="1" stop-color="#002735"/></linearGradient><linearGradient id="g"><stop stop-color="#00e5ff"/><stop offset=".5" stop-color="#9b5cff"/><stop offset="1" stop-color="#ff3df2"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.e{fill:#67f6ff;font-size:14px;letter-spacing:5px}.h{fill:#fff;font-size:48px;font-weight:800}.s{fill:#b7c5dd;font-size:17px}.c{fill:#090f25;stroke:url(#g);stroke-width:2}.n{fill:#67f6ff;font-size:13px}.l{fill:#fff;font-size:19px;font-weight:700}.m{fill:#9eacd0;font-size:13px}.p{stroke:url(#g);stroke-width:4;fill:none;stroke-dasharray:10 12;animation:f 1.4s linear infinite}.r{animation:q 2s ease-in-out infinite}@keyframes f{to{stroke-dashoffset:-44}}@keyframes q{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.p,.r{animation:none}}</style></defs><rect width="1200" height="520" rx="30" fill="url(#bg)"/><circle class="r" cx="1080" cy="95" r="75" fill="none" stroke="#a855f7"/><circle cx="1080" cy="95" r="12" fill="#fff" filter="url(#gl)"/><text x="70" y="72" class="e">SONOXO // CONCEPT SYSTEM</text><text x="70" y="130" class="h">EYERIS</text><text x="70" y="164" class="s">Reserved visual-intelligence workspace • concept only</text><path class="p" d="M225 322H375M525 322H675M825 322H975"/><g><rect class="c" x="55" y="250" width="230" height="145" rx="20"/><text class="n" x="79" y="282">01</text><text class="l" x="79" y="322">OBSERVE</text><text class="m" x="79" y="350">Authorized input</text></g><g><rect class="c" x="355" y="250" width="230" height="145" rx="20"/><text class="n" x="379" y="282">02</text><text class="l" x="379" y="322">UNDERSTAND</text><text class="m" x="379" y="350">Documented analysis</text></g><g><rect class="c" x="655" y="250" width="230" height="145" rx="20"/><text class="n" x="679" y="282">03</text><text class="l" x="679" y="322">ASSIST</text><text class="m" x="679" y="350">Reviewable result</text></g><g><rect class="c" x="955" y="250" width="230" height="145" rx="20"/><text class="n" x="979" y="282">04</text><text class="l" x="979" y="322">VERIFY</text><text class="m" x="979" y="350">Reproducible evidence</text></g><text class="s" x="70" y="466">No code or deployment exists yet. Build status remains visible.</text></svg>